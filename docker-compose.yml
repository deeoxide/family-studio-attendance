services:
  # Local Postgres for development and tests, matching the production
  # datasource in server/prisma/schema.prisma. Not used in deployment —
  # Railway (or whichever host) provides its own managed Postgres there.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
      POSTGRES_DB: attendance
    ports:
      - '55433:5432'
    volumes:
      - attendance_pg_data:/var/lib/postgresql/data

volumes:
  attendance_pg_data:
