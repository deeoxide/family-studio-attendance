<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Family Studio — Attendance Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Noto+Sans+Lao:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f3f2f2; --surface:#eae9e9; --text:#201f1d; --accent:#b68235;
    --divider:rgba(32,31,29,0.16);
    --n100:#f8f4f4; --n200:#eae7e7; --n300:#d7d3d3; --n500:#9b9797; --n600:#7d7979;
    --n700:#605d5d; --n800:#444141; --n900:#2d2b2b;
    --a100:#fff3e4; --a200:#ffe3bf; --a300:#facb8d; --a700:#7d5411; --a800:#5a3b0a; --a900:#3a270d;
    --ok:#3f7d4f; --okBg:#eef3ee; --okBorder:#cfe0d1;
    --danger:#b0402f; --dangerBg:#f7ebe8; --dangerBorder:#e6c9c2;
    --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
    --lao:"Noto Sans Lao","Phetsarath OT","Leelawadee UI","Lao UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--serif);
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:28px 16px 60px;
  }
  body[data-lang="lo"]{font-family:var(--lao)}
  a{color:inherit}

  /* ── prototype toolbar (outside the phone) ─────────────────────── */
  .toolbar{
    width:100%; max-width:412px; margin-bottom:18px;
    display:flex; flex-direction:column; gap:8px;
  }
  .toolbar h1{
    font-size:15px; margin:0; font-weight:600; letter-spacing:.2px;
  }
  .toolbar p{margin:0; font-size:12px; color:var(--n600); line-height:1.5}
  .toolbar .row{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px}
  .chip{
    font:inherit; font-size:11.5px; cursor:pointer;
    border:1px solid var(--divider); background:#fff; color:var(--n700);
    padding:6px 11px; border-radius:4px; letter-spacing:.3px;
  }
  .chip[aria-pressed="true"]{background:var(--a100); border-color:var(--accent); color:var(--a800)}
  .chip:disabled{opacity:.4; cursor:default}

  /* ── phone frame ──────────────────────────────────────────────── */
  .phone{
    width:390px; height:800px; max-width:100%;
    background:#fff; border-radius:38px; overflow:hidden;
    border:1px solid var(--divider);
    box-shadow:0 2px 4px rgba(45,43,43,.14), 0 24px 60px rgba(45,43,43,.20);
    display:flex; flex-direction:column; position:relative;
  }
  .statusbar{
    height:34px; flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:0 24px; font-size:12px; font-weight:600; color:var(--text);
    font-variant-numeric:tabular-nums;
  }
  .statusbar .dots{letter-spacing:2px; color:var(--n700)}

  .app{flex:1; display:flex; flex-direction:column; min-height:0}

  /* header */
  .hdr{
    padding:8px 20px 12px; display:flex; align-items:flex-end; justify-content:space-between;
    gap:12px; border-bottom:1px solid var(--divider);
  }
  .kicker{font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--a700)}
  .hdr .title{font-size:21px; font-weight:600; margin-top:2px; line-height:1.15}
  body[data-lang="lo"] .hdr .title{font-weight:600}
  .hdr-right{display:flex; align-items:center; gap:9px}
  .lang{display:flex; border:1px solid var(--divider); border-radius:4px; overflow:hidden}
  .lang button{
    font:inherit; font-size:11.5px; min-width:38px; height:34px; border:0; cursor:pointer;
    background:#fff; color:var(--n700);
  }
  .lang button + button{border-left:1px solid var(--divider)}
  .lang button[aria-pressed="true"]{background:var(--a100); color:var(--a800)}
  .avatar{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--divider);
    background:var(--n100); display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:600; color:var(--n800); font-family:var(--serif);
  }

  /* body */
  .body{flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px}
  .body::-webkit-scrollbar{width:0}

  /* tab bar */
  .tabs{
    flex:none; display:flex; border-top:1px solid var(--divider); background:#fff;
    padding-bottom:14px;
  }
  .tabs button{
    flex:1; border:0; background:none; cursor:pointer; font:inherit;
    padding:10px 2px 4px; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--n600);
  }
  .tabs button[aria-pressed="true"]{color:var(--a800)}
  .tabs .ti{width:20px; height:20px; display:block}
  .tabs .tl{font-size:10px; letter-spacing:.2px}

  /* ── components ──────────────────────────────────────────────── */
  .card{border:1px solid var(--divider); border-radius:4px; padding:16px}
  .card.pad0{padding:0}
  .card.accent{border-color:var(--a200); background:var(--a100)}
  .card.flush > * + *{border-top:1px solid var(--divider)}
  .h{font-size:17px; font-weight:600}
  body[data-lang="lo"] .h{font-weight:600}
  .muted{font-size:11.5px; line-height:1.5; color:var(--n700)}
  .row{display:flex; justify-content:space-between; align-items:center; gap:12px}
  .row.baseline{align-items:baseline}
  .divider{height:1px; background:var(--divider); margin:14px 0}
  .tag{
    display:inline-block; align-self:flex-start; font-size:11px; padding:3px 10px; border-radius:3px;
    background:var(--n100); color:var(--n800);
  }
  .tag.accent{background:var(--a100); color:var(--a800)}
  .tag.outline{background:transparent; border:1px solid var(--accent); color:var(--accent)}
  .tag.ok{background:var(--okBg); color:var(--ok)}
  .btn{
    width:100%; min-height:54px; border:1.5px solid var(--accent); border-radius:4px;
    background:var(--a100); color:var(--a800); font:inherit; font-size:16px; font-weight:600;
    cursor:pointer; padding:0 16px;
  }
  body[data-lang="lo"] .btn{font-weight:400}
  .btn.secondary{border-color:var(--n900); background:#fff; color:var(--n900)}
  .btn:disabled{opacity:.42; cursor:default}
  .btn.sm{min-height:44px; font-size:12.5px; font-weight:400; width:auto; padding:0 15px}

  .seg{display:flex; border:1px solid var(--divider); border-radius:4px; overflow:hidden}
  .seg button{
    flex:1; border:0; background:#fff; cursor:pointer; font:inherit; font-size:12px;
    min-height:36px; color:var(--n700); padding:0 6px;
  }
  .seg button + button{border-left:1px solid var(--divider)}
  .seg button[aria-pressed="true"]{background:var(--a100); color:var(--a800)}

  .statrow{display:flex; border:1px solid var(--divider); border-radius:4px; overflow:hidden}
  .statrow > div{flex:1; padding:14px 4px; text-align:center}
  .statrow > div + div{border-left:1px solid var(--divider)}
  .statrow .v{font-size:28px; font-family:var(--serif); font-variant-numeric:tabular-nums}
  .statrow .l{font-size:10.5px; color:var(--n700); margin-top:5px}

  .list > div{padding:12px 16px; border-top:1px solid var(--divider)}
  .list > div:first-child{border-top:0}
  .list .primary{font-size:13px}
  .list .sub{font-size:11px; color:var(--n700); margin-top:2px}

  .big{font-family:var(--serif); font-variant-numeric:tabular-nums}
  .num{font-variant-numeric:tabular-nums}

  .field{margin-bottom:14px}
  .field label{
    display:block; font-size:11px; letter-spacing:1px; text-transform:uppercase;
    color:var(--n700); margin-bottom:6px;
  }
  .field input{
    width:100%; min-height:48px; border:1px solid var(--divider); border-radius:4px;
    padding:0 12px; font:inherit; font-size:14px; color:var(--text); background:#fff;
  }

  .toast{
    position:absolute; left:16px; right:16px; bottom:74px;
    background:var(--n900); color:#fff; border-radius:4px; padding:13px 15px; font-size:12.5px;
    box-shadow:0 3px 10px rgba(45,43,43,.3); opacity:0; transform:translateY(6px);
    transition:opacity .2s, transform .2s; pointer-events:none;
  }
  .toast.show{opacity:1; transform:none}

  .dot{width:9px; height:9px; border-radius:50%; display:inline-block; flex:none}
  .dot.g{background:var(--ok)} .dot.y{background:var(--accent)} .dot.r{background:var(--danger)}

  .bar{height:6px; background:var(--n200); border-radius:99px; overflow:hidden; margin:10px 0}
  .bar > i{display:block; height:100%; background:var(--accent)}

  .ticks{display:flex; gap:5px}
  .ticks > i{flex:1; height:5px; border-radius:99px; background:var(--n200)}
  .ticks > i.f1{background:var(--a300)} .ticks > i.f2{background:var(--accent)}

  /* login */
  .login{padding:24px 24px 30px; display:flex; flex-direction:column; height:100%; overflow-y:auto}
  .login .lead{font-size:34px; margin:26px 0 30px; line-height:1.1}
  .demo{margin-top:20px}
  .demo .who{
    width:100%; text-align:left; border:1px solid var(--divider); background:#fff; cursor:pointer;
    border-radius:4px; padding:11px 13px; font:inherit; margin-top:8px; display:flex;
    justify-content:space-between; align-items:center;
  }
  .demo .who small{color:var(--n600); font-size:11px}
  .hint{font-size:11px; color:var(--n600); text-align:center; margin-top:20px; line-height:1.6}

  @media (max-width:430px){
    body{padding:12px 0 40px}
    .phone{width:100%; height:88vh; border-radius:0; border-left:0; border-right:0}
    .toolbar{padding:0 14px}
  }
</style>
</head>
<body data-lang="en">

<div class="toolbar">
  <h1>Family Studio — Attendance / Leave / Payroll</h1>
  <p>Standalone UI prototype with mock data. No server, no GPS. Interactive: check in/out, switch language, approve requests, open payslips.</p>
  <div class="row" role group aria-label="View as role">
    <span style="font-size:11.5px;color:var(--n600);align-self:center">View as:</span>
    <button class="chip" data-role="EMPLOYEE" aria-pressed="true">Employee</button>
    <button class="chip" data-role="MANAGER" aria-pressed="false">Manager</button>
    <button class="chip" data-role="HR" aria-pressed="false">HR / Admin</button>
    <button class="chip" data-role="reset" aria-pressed="false">↺ Sign out</button>
  </div>
</div>

<div class="phone">
  <div class="statusbar">
    <span id="clock">9:41</span>
    <span class="dots">••• ▾ ▮</span>
  </div>
  <div class="app" id="app"><!-- rendered by JS --></div>
  <div class="toast" id="toast"></div>
</div>

  function computeTax(gross){
    var t = 0;
    if (gross > 1300000) t += Math.round((Math.min(gross,5000000) - 1300000) * 0.05);
    if (gross > 5000000) t += Math.round((Math.min(gross,15000000) - 5000000) * 0.10);
    return t;
  }
  function computePay(s){
    var gross = s.basic + s.ot + s.allow;
    var sso = Math.round(gross * 0.055);
    var tax = computeTax(gross);
    return { basic:s.basic, ot:s.ot, allow:s.allow, gross:gross, sso:sso, tax:tax, net: gross - sso - tax };
  }

  bodyBind.ATT = function(){
    var inBtn = document.getElementById("a-in");
    if (inBtn) inBtn.addEventListener("click", function(){
      st.att = { status:"in", inAt: nowHM(), outAt:null, startedMs: Date.now() };
      render();
      flash(t("checkedInAt") + " " + st.att.inAt);
    });
    var outBtn = document.getElementById("a-out");
    if (outBtn) outBtn.addEventListener("click", function(){
      st.att.status = "done"; st.att.outAt = nowHM();
      render();
      flash(t("checkedOutAt") + " " + st.att.outAt);
    });
    // live timer
    if (st.att.status === "in"){
      var elT = document.getElementById("a-timer");
      if (elT){
        var tick = function(){
          if (st.att.status !== "in") return;
          var el2 = document.getElementById("a-timer");
          if (!el2) return;
          var s = Math.floor((Date.now() - st.att.startedMs)/1000);
          var hh = String(Math.floor(s/3600)).padStart(2,"0");
          var mm = String(Math.floor(s%3600/60)).padStart(2,"0");
          var ss = String(s%60).padStart(2,"0");
          el2.textContent = hh + ":" + mm + ":" + ss;
          setTimeout(tick, 1000);
        };
        setTimeout(tick, 1000);
      }
    }
  };

            ? '<span class="tag">' + esc(t("notInYet")) + '</span>'
            : '<span class="tag ' + (late?"accent":"ok") + '">' + esc(t("inShort")) + ' ' + esc(s.todayIn) + '</span>';
          return '<div class="row"><div style="display:flex;align-items:center;gap:11px">' +
              '<div class="avatar" style="width:34px;height:34px;font-size:12px">' + esc(s.initials) + '</div>' +
              '<div><div class="primary">' + esc(nm(s)) + '</div><div class="sub">' + esc(title(s)) + '</div></div>' +
            '</div>' + tag + '</div>';
        }).join("") +
      '</div>' +
    '</div>';
  }

  /* ────────────────────────────────────────────────────────────────
     Screen — Approvals (manager)
  ──────────────────────────────────────────────────────────────── */
  function viewApprovals(){
    var seg = '<div class="seg">' +
      '<button data-at="leave" aria-pressed="' + (st.apprTab==="leave") + '">' + esc(t("leaveApprovals")) +
        (st.pending.length ? " (" + st.pending.length + ")" : "") + '</button>' +
      '<button data-at="att" aria-pressed="' + (st.apprTab==="att") + '">' + esc(t("attendanceCorrections")) + '</button>' +
    '</div>';

    var content;
    if (st.apprTab === "att"){
      content = '<div class="card" style="align-items:center;text-align:center;padding:34px 16px;display:flex;flex-direction:column">' +
        '<div class="h">' + esc(t("noCorrections")) + '</div>' +
        '<div class="muted" style="margin-top:6px">' + esc(t("allClearNote")) + '</div></div>';
    } else if (st.pending.length === 0){
      content = '<div class="card" style="align-items:center;text-align:center;padding:34px 16px;display:flex;flex-direction:column">' +
        '<div class="h">' + esc(t("allClear")) + '</div>' +
        '<div class="muted" style="margin-top:6px">' + esc(t("allClearNote")) + '</div></div>';
    } else {
      content = st.pending.map(function(r){
        var s = byCode[r.code];
        var tkey = r.type==="ANNUAL"?"annual":r.type==="SICK"?"sick":"personal";
        return '<div class="card" style="display:flex;flex-direction:column;gap:11px" data-card="' + r.id + '">' +
          '<div style="display:flex;align-items:center;gap:11px">' +
            '<div class="avatar" style="width:34px;height:34px;font-size:12px">' + esc(s.initials) + '</div>' +
            '<div style="flex:1"><div style="font-size:13.5px">' + esc(nm(s)) + '</div>' +
              '<div class="sub">' + esc(t(tkey)) + '</div></div>' +
            '<span class="big" style="font-size:20px">' + r.wd + '</span>' +
          '</div>' +
          '<div style="font-size:12px;color:var(--n800)">' + esc(rangeLabel(r.from,r.to,st.lang)) + '</div>' +
          '<div class="muted">' + esc(r.reason) + '</div>' +
          '<div style="display:flex;gap:9px">' +
            '<button class="btn" style="flex:1" data-ok="' + r.id + '">' + esc(t("approve")) + '</button>' +
            '<button class="btn secondary" style="flex:1" data-no="' + r.id + '">' + esc(t("reject")) + '</button>' +
          '</div>' +
        '</div>';
      }).join("");
    }
    return seg + '<div style="height:2px"></div>' + content;
  }
  bodyBind.APPR = function(){
    elApp.querySelectorAll("[data-at]").forEach(function(b){
      b.addEventListener("click", function(){ st.apprTab = b.getAttribute("data-at"); render(); });
    });
    var decide = function(id, ok){
      st.pending = st.pending.filter(function(r){ return r.id !== id; });
      flash(ok ? t("approvedToast") : t("rejectedToast"));
      render();
    };
    elApp.querySelectorAll("[data-ok]").forEach(function(b){
      b.addEventListener("click", function(){ decide(b.getAttribute("data-ok"), true); });
    });
    elApp.querySelectorAll("[data-no]").forEach(function(b){
      b.addEventListener("click", function(){ decide(b.getAttribute("data-no"), false); });
    });
  };

  /* ────────────────────────────────────────────────────────────────
     Screen — Payroll run (HR)
  ──────────────────────────────────────────────────────────────── */
  function viewRun(){
    var rows = STAFF.map(function(s){ return { s:s, p:computePay(s) }; });
    var tot = rows.reduce(function(a,r){
      a.gross += r.p.gross; a.sso += r.p.sso; a.tax += r.p.tax; a.net += r.p.net; return a;
    }, {gross:0,sso:0,tax:0,net:0});

    return '<div style="display:flex;flex-direction:column;gap:16px">' +
      '<div class="card">' +
        '<div class="kicker">' + esc(t("periodOpenLabel")) + '</div>' +
        '<div class="h" style="font-size:22px;margin-top:5px">' + esc(periodLabel(PERIOD, st.lang)) + '</div>' +
        '<div class="divider"></div>' +
        '<div class="row"><span class="muted">' + esc(t("headcount")) + '</span><span class="big" style="font-size:16px">' + STAFF.length + '</span></div>' +
        '<div class="row" style="margin-top:8px"><span class="muted">' + esc(t("gross")) + '</span><span class="big" style="font-size:16px">' + lak(tot.gross) + '</span></div>' +
        '<div class="row" style="margin-top:8px"><span class="muted">' + esc(t("ssoTotal")) + '</span><span class="num" style="font-size:13px;color:var(--n700)">−' + lak(tot.sso) + '</span></div>' +
        '<div class="row" style="margin-top:8px"><span class="muted">' + esc(t("taxTotal")) + '</span><span class="num" style="font-size:13px;color:var(--n700)">−' + lak(tot.tax) + '</span></div>' +
      '</div>' +

      '<div class="card accent row baseline">' +
        '<span style="font-weight:600;font-size:15px;color:var(--a900)">' + esc(t("netPay")) + '</span>' +
        '<span class="big" style="font-size:24px;color:var(--a900)">' + lak(tot.net) + '</span>' +
      '</div>' +

      '<div><div class="h" style="margin-bottom:8px">' + esc(t("perPerson")) + '</div>' +
        '<div class="card pad0 list">' +
          rows.map(function(r){
            return '<div class="row"><div><div class="primary">' + esc(nm(r.s)) + '</div>' +
              '<div class="sub">' + esc(title(r.s)) + '</div></div>' +
              '<span class="big" style="font-size:13.5px">' + lak(r.p.net) + '</span></div>';
          }).join("") +
        '</div>' +
      '</div>' +

      (st.runApproved
        ? '<div class="card ok-note" style="border-color:var(--okBorder);background:var(--okBg);display:flex;align-items:center;gap:10px">' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2" stroke-linecap="round"><path d="M4 12.5l5 5 11-11"/></svg>' +
            '<span style="font-size:13px;color:var(--ok)">' + esc(t("runApprovedToast")) + '</span></div>'
        : '<button class="btn" id="run-go">' + esc(t("approveRun")) + '</button>') +
    '</div>';
  }
  bodyBind.RUN = function(){
    var b = document.getElementById("run-go");
    if (b) b.addEventListener("click", function(){ st.runApproved = true; flash(t("runApprovedToast")); render(); });
  };

  /* ────────────────────────────────────────────────────────────────
     Screen — People (HR directory)
  ──────────────────────────────────────────────────────────────── */
  function viewPeople(){
    return '<div style="display:flex;flex-direction:column;gap:16px">' +
      '<div><div class="h" style="margin-bottom:8px">' + esc(t("directory")) + '</div>' +
        '<div class="card pad0 list">' +
          STAFF.map(function(s){
            var cls = s.late === 0 ? "g" : s.late <= 3 ? "y" : "r";
            var lateTxt = s.late === 0 ? t("noLateThisMonth")
              : s.late + " " + t("times") + " " + t("lateThisMonth").toLowerCase();
            return '<div class="row"><div style="display:flex;align-items:center;gap:11px">' +
                '<span class="dot ' + cls + '"></span>' +
                '<div><div class="primary">' + esc(nm(s)) + '</div>' +
                  '<div class="sub">' + esc(title(s)) + ' · ' + esc(lateTxt) + '</div></div>' +
              '</div>' +
              '<span class="big" style="font-size:12.5px;color:var(--n600)">' + lak(s.basic) + '</span>' +
            '</div>';
          }).join("") +
        '</div>' +
        '<div class="muted" style="margin-top:9px">' + esc(t("kpiLegend")) + '</div>' +
      '</div>' +
    '</div>';
  }

  /* ────────────────────────────────────────────────────────────────
     Toolbar wiring (outside the phone)
  ──────────────────────────────────────────────────────────────── */
  function syncRoleChips(){
    document.querySelectorAll(".toolbar [data-role]").forEach(function(c){
      var r = c.getAttribute("data-role");
      c.setAttribute("aria-pressed", String(st.user && r === st.user.role));
    });
  }
  document.querySelectorAll(".toolbar [data-role]").forEach(function(c){
    c.addEventListener("click", function(){
      var r = c.getAttribute("data-role");
      if (r === "reset"){ signOut(); syncRoleChips(); return; }
      var first = STAFF.filter(function(s){ return s.role === r; })[0];
      signIn(first);
    });
  });

  /* status-bar clock */
  function tickClock(){
    var d = new Date();
    document.getElementById("clock").textContent =
      d.getHours() + ":" + String(d.getMinutes()).padStart(2,"0");
    setTimeout(tickClock, 20000);
  }
  tickClock();

  /* go */
  render();
})();
</script>
</body>
</html>
