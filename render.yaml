services:
  - type: web
    name: family-studio-attendance-api
    runtime: node
    rootDir: server
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: family-studio-attendance-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000

databases:
  - name: family-studio-attendance-db
    plan: free
    region: singapore
