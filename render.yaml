services:
  - type: web
    name: family-studio-attendance-api
    runtime: node
    rootDir: server
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      # Database lives on Supabase, not a Render-managed Postgres — set these
      # two by hand in the Render dashboard (Environment tab), sync: false so
      # `render blueprint` never prompts to overwrite them. Values: the pooled
      # (port 6543, pgbouncer) and direct (port 5432) Supabase connection
      # strings — see server/.env.example for the exact format.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
